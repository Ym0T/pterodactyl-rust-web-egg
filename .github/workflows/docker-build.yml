name: Build and Push Docker Image

on:
  # Daily check; the image is only rebuilt when an upstream version changed (see below)
  schedule:
    - cron: '24 9 * * *'
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual run, e.g. to ship a security fix right away
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Full rebuild without cache'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        rust_version: [stable, nightly]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Registry cache refs must be lowercase
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The build cache never expires on its own. These values are passed as build args,
      # so the affected layers are rebuilt as soon as one of them changes:
      # the Rust channel manifest (new stable release, or daily for nightly),
      # the cloudflared release tag and the month as fallback for Debian packages.
      - name: Check upstream versions
        id: versions
        env:
          RUST_CHANNEL: ${{ matrix.rust_version }}
        run: |
          set -euo pipefail
          rust=$(curl -fsSL "https://static.rust-lang.org/dist/channel-rust-${RUST_CHANNEL}.toml.sha256" | cut -c1-16)
          cloudflared=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cloudflare/cloudflared/releases/latest | sed 's#.*/##')
          for name in rust cloudflared; do
            test -n "${!name}" || { echo "Could not determine $name version"; exit 1; }
          done
          {
            echo "rust=$rust"
            echo "cloudflared=$cloudflared"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
          echo "rust-manifest=$rust cloudflared=$cloudflared"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.rust_version }}
            type=raw,value=${{ matrix.rust_version }}-{{sha}}
            type=raw,value=latest,enable=${{ matrix.rust_version == 'stable' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_VERSION=${{ matrix.rust_version }}
            RUST_CHANNEL_HASH=${{ steps.versions.outputs.rust }}
            CLOUDFLARED_VERSION=${{ steps.versions.outputs.cloudflared }}
            CACHE_MONTH=${{ steps.versions.outputs.month }}
          no-cache: ${{ inputs.no_cache == true }}
          # One cache per toolchain, so stable and nightly don't overwrite each other
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME_LC }}:buildcache-${{ matrix.rust_version }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_NAME_LC, matrix.rust_version) || '' }}

      - name: Verify image was built
        if: github.event_name != 'pull_request'
        run: |
          echo "Image built and pushed successfully for Rust ${{ matrix.rust_version }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
